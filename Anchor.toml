[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.14"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
civ = "GPdm56hssFExZrtGspZprjbfecXbRKYtAJGQ4X1ysNkc"

[programs.devnet]
civ = "GPdm56hssFExZrtGspZprjbfecXbRKYtAJGQ4X1ysNkc"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Integration tests live in the `tests` pnpm package; run them from inside it.
# --no-experimental-strip-types stops Node 24 running the .ts files itself (as ESM), so ts-mocha's
# TypeScript compiler handles them instead.
# -t 120000: any single test that takes over 2 minutes fails instead of hanging the run.
# --exit: stop once the tests are done, even if a failed call left a connection open (without it a
# run with failures can hang forever on an open websocket).
test = "NODE_OPTIONS=--no-experimental-strip-types pnpm -C tests exec ts-mocha -p ./tsconfig.json -t 120000 --exit \"./*.ts\""

[hooks]
