[package]
name = "civ"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "civ"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
# "=" pins exactly 1.0.2. A plain "1.0.2" means "1.0.2 or newer 1.x", which resolved to 1.2.2.
# Must match the Anchor CLI and @anchor-lang/core. See docs/decisions/0001-toolchain.md.
anchor-lang = "=1.0.2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
