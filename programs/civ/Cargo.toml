[package]
name = "civ"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "civ"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Turns on `start_match_local_test` (a seed chosen by the test instead of the VRF oracle, which
# the local validator doesn't have). Only for `anchor test`; never deploy a build with it.
local-testing = []


[dependencies]
# "=" pins exactly 1.0.2. A plain "1.0.2" means "1.0.2 or newer 1.x", which resolved to 1.2.2.
# Must match the Anchor CLI and @anchor-lang/core. See docs/decisions/0001-toolchain.md.
# "init-if-needed": join_match creates a player's Profile the first time they join.
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
# MagicBlock Ephemeral Rollups + VRF. 0.16.2 is the version every MagicBlock Anchor 1.0.2 example
# pins; "anchor" = Anchor 1.x support, "vrf" = verifiable randomness. See 0001-toolchain.md.
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "vrf"] }
# All game rules. Default features only: the YAML compiler is never built into the program.
civ-core = { path = "../../crates/civ-core" }
# Views account bytes as civ-core types in place. Already in Cargo.lock (Anchor and civ-core use
# the same 1.25), so this adds no new crate.
# SHA-256 for policy commitments (uses the sol_sha256 syscall on chain). The exact version
# Anchor's Solana crates already use, so it adds nothing new to Cargo.lock.
solana-sha256-hasher = "=3.1.0"
bytemuck = { version = "1.25", default-features = false, features = ["derive", "min_const_generics"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
