# iron-turtle: a wall of Guards (and an Elite when it can) around steadily bought land. Strikes
# back at the nearest enemy's border only when it is overwhelmingly stronger.
name: iron-turtle
rules:
  - if: food < 25
    do: assign_workers(food)
  - if: food > 60
    do: assign_workers(gold)
  - if: my.army >= 12 and my.army > 200% nearest_enemy.army
    do: attack(nearest_enemy, border)
  - if: my.workers < 6 and food >= 20
    do: build(worker)
  - if: gold >= 40 and coins >= 40
    do: build(elite)
  - if: food >= 25 and gold >= 10
    do: claim_tile(nearest_free)
  - if: my.guards < 12 and ore >= 15
    do: build(guard)
