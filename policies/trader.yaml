# silk-trader: a big worker economy that turns every surplus into coins, keeping its wealth in
# coins (their value doesn't fall when the market floods).
name: silk-trader
rules:
  - if: food < 30
    do: assign_workers(food)
  - if: my.workers < 8 and food >= 25
    do: build(worker)
  - if: ore > 40
    do: sell(ore, 20)
  - if: gold > 40
    do: sell(gold, 20)
  - if: food > 80
    do: sell(food, 20)
  - if: my.guards < 3 and ore >= 15
    do: build(guard)
  - if: food >= 40 and gold >= 10
    do: claim_tile(nearest_deposit)
