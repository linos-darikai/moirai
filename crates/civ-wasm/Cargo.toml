[package]
name = "civ-wasm"
version = "0.1.0"
edition = "2021"
description = "Thin wasm-bindgen wrapper that exposes civ-core to the browser. No game logic."
publish = false

[lib]
# cdylib = the .wasm file the browser loads; rlib = lets Rust tests use this crate too.
crate-type = ["cdylib", "rlib"]

[dependencies]
civ-core = { path = "../civ-core", features = ["compiler"] }
wasm-bindgen = "0.2"
